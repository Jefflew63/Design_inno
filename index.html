<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Sleeping Pod Booking</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Franklin:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-alt: #F9FAFB;
    --border: #E2E5EA;
    --border-light: #EEF0F3;
    --text-primary: #1A1D23;
    --text-secondary: #5F6B7A;
    --text-muted: #8C95A3;
    --available: #22A85B;
    --available-bg: #E8F8EF;
    --available-border: #B4EACC;
    --occupied: #DC3545;
    --occupied-bg: #FDEAEC;
    --occupied-border: #F5C2C7;
    --reserved: #2563EB;
    --reserved-bg: #E8EFFD;
    --reserved-border: #B6CCFA;
    --accent: #2563EB;
    --accent-hover: #1D4FD7;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-icon svg { width: 22px; height: 22px; fill: #fff; }
  .header h1 {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }
  .legend {
    display: flex; gap: 20px; align-items: center;
    font-size: 13px; color: var(--text-secondary);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .legend-dot.available { background: var(--available); }
  .legend-dot.occupied { background: var(--occupied); }
  .legend-dot.reserved { background: var(--reserved); }

  /* ── Map Area ── */
  .main { padding: 32px 40px; max-width: 1280px; margin: 0 auto; }

  .map-container {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    padding: 32px;
    position: relative;
    margin-bottom: 28px;
  }
  .map-title {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 24px;
  }
  .campus-map {
    width: 100%;
    aspect-ratio: 16/8;
    background: var(--surface-alt);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    position: relative;
    overflow: hidden;
  }
  .campus-map svg { width: 100%; height: 100%; }

  /* ── Location Markers on Map ── */
  .map-marker {
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .map-marker:hover { transform: scale(1.08); }

  /* ── Location Cards ── */
  .locations-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .location-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
    cursor: pointer;
  }
  .location-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--accent);
  }
  .location-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(37,99,235,0.15), var(--shadow-md);
  }
  .location-card-header {
    padding: 20px 22px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .location-name {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .location-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--available-bg);
    color: var(--available);
    border: 1px solid var(--available-border);
  }
  .location-badge.none {
    background: var(--occupied-bg);
    color: var(--occupied);
    border-color: var(--occupied-border);
  }

  /* ── Pods Grid inside card ── */
  .pods-container { padding: 4px 22px 20px; }
  .pods-grid {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .pod {
    width: 56px; height: 56px;
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    cursor: default;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
    border: 1.5px solid transparent;
  }
  .pod svg { width: 20px; height: 20px; margin-bottom: 2px; }
  .pod-label { font-size: 10px; font-weight: 500; }
  .pod.available {
    background: var(--available-bg);
    border-color: var(--available-border);
    color: var(--available);
    cursor: pointer;
  }
  .pod.available:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(34,168,91,0.2);
  }
  .pod.occupied {
    background: var(--occupied-bg);
    border-color: var(--occupied-border);
    color: var(--occupied);
    opacity: 0.7;
  }
  .pod.reserved {
    background: var(--reserved-bg);
    border-color: var(--reserved-border);
    color: var(--reserved);
    opacity: 0.8;
  }
  .pod.selected {
    transform: translateY(-2px);
    box-shadow: 0 0 0 2px var(--available), 0 4px 12px rgba(34,168,91,0.25);
  }

  /* ── Time Slot Panel ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.2s ease;
  }
  .overlay.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .panel {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  .panel-header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border-light);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .panel-title {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .panel-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .panel-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .panel-close:hover { background: var(--bg); }
  .panel-close svg { width: 16px; height: 16px; stroke: var(--text-secondary); }

  .panel-body { padding: 20px 28px 28px; }

  .timeslots-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .timeslots-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .timeslot {
    padding: 10px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-primary);
  }
  .timeslot:hover {
    border-color: var(--accent);
    background: var(--reserved-bg);
    color: var(--accent);
  }
  .timeslot.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .timeslot.unavailable {
    background: var(--surface-alt);
    color: var(--text-muted);
    cursor: not-allowed;
    opacity: 0.5;
    text-decoration: line-through;
  }

  /* ── Form ── */
  .form-section {
    display: none;
    border-top: 1px solid var(--border-light);
    padding-top: 20px;
    margin-top: 4px;
  }
  .form-section.visible { display: block; }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text-primary);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 14px;
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .form-input::placeholder { color: var(--text-muted); }

  .btn-reserve {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-reserve:hover { background: var(--accent-hover); }
  .btn-reserve:disabled {
    background: var(--border);
    cursor: not-allowed;
    color: var(--text-muted);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text-primary);
    color: #fff;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 999;
    opacity: 0;
    transition: all 0.35s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .locations-grid { grid-template-columns: 1fr; }
    .header { padding: 16px 20px; }
    .main { padding: 20px; }
    .legend { display: none; }
    .panel { width: 95vw; }
    .timeslots-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1m-2 0h2"/></svg>
    </div>
    <div>
      <h1>Campus Pod Booking</h1>
      <div class="header-subtitle">Reserve a sleeping pod across campus</div>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot available"></span> Available</div>
    <div class="legend-item"><span class="legend-dot occupied"></span> Occupied</div>
    <div class="legend-item"><span class="legend-dot reserved"></span> Reserved</div>
  </div>
</div>

<div class="main">
  <!-- Campus Map -->
  <div class="map-container">
    <div class="map-title">Campus Map</div>
    <div class="campus-map">
      <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect width="1000" height="500" fill="#F9FAFB"/>
        <!-- Paths / Roads -->
        <path d="M0 250 Q250 240 500 250 Q750 260 1000 250" stroke="#E2E5EA" stroke-width="28" fill="none" stroke-linecap="round"/>
        <path d="M500 0 Q490 125 500 250 Q510 375 500 500" stroke="#E2E5EA" stroke-width="22" fill="none" stroke-linecap="round"/>
        <path d="M200 80 Q220 165 200 250" stroke="#EEF0F3" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M800 250 Q790 375 800 460" stroke="#EEF0F3" stroke-width="14" fill="none" stroke-linecap="round"/>
        <!-- Trees / Green areas -->
        <circle cx="100" cy="120" r="30" fill="#E8F8EF" stroke="#B4EACC" stroke-width="1"/>
        <circle cx="140" cy="400" r="40" fill="#E8F8EF" stroke="#B4EACC" stroke-width="1"/>
        <circle cx="900" cy="100" r="35" fill="#E8F8EF" stroke="#B4EACC" stroke-width="1"/>
        <circle cx="600" cy="420" r="28" fill="#E8F8EF" stroke="#B4EACC" stroke-width="1"/>
        <circle cx="400" cy="80" r="22" fill="#E8F8EF" stroke="#B4EACC" stroke-width="1"/>
        <!-- Buildings (generic) -->
        <rect x="320" y="340" width="80" height="50" rx="6" fill="#EEF0F3" stroke="#E2E5EA" stroke-width="1"/>
        <text x="360" y="370" text-anchor="middle" font-size="11" fill="#8C95A3" font-family="DM Sans">Admin</text>
        <rect x="650" y="80" width="70" height="45" rx="6" fill="#EEF0F3" stroke="#E2E5EA" stroke-width="1"/>
        <text x="685" y="107" text-anchor="middle" font-size="11" fill="#8C95A3" font-family="DM Sans">Cafeteria</text>

        <!-- Location 1: Library -->
        <g class="map-marker" onclick="scrollToLocation(0)" data-loc="0">
          <rect x="130" y="195" width="140" height="65" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#mapShadow)"/>
          <circle cx="160" cy="217" r="8" fill="#2563EB"/>
          <text x="160" y="221" text-anchor="middle" font-size="10" fill="#fff" font-weight="700" font-family="DM Sans">1</text>
          <text x="210" y="221" text-anchor="middle" font-size="13" fill="#1A1D23" font-weight="700" font-family="Libre Franklin">Library</text>
          <text x="200" y="245" text-anchor="middle" font-size="11" fill="#5F6B7A" font-family="DM Sans">4 Pods · 2 Free</text>
        </g>

        <!-- Location 2: Student Lounge -->
        <g class="map-marker" onclick="scrollToLocation(1)" data-loc="1">
          <rect x="430" y="130" width="165" height="65" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#mapShadow)"/>
          <circle cx="462" cy="152" r="8" fill="#2563EB"/>
          <text x="462" y="156" text-anchor="middle" font-size="10" fill="#fff" font-weight="700" font-family="DM Sans">2</text>
          <text x="530" y="156" text-anchor="middle" font-size="13" fill="#1A1D23" font-weight="700" font-family="Libre Franklin">Student Lounge</text>
          <text x="512" y="180" text-anchor="middle" font-size="11" fill="#5F6B7A" font-family="DM Sans">5 Pods · 3 Free</text>
        </g>

        <!-- Location 3: Sports Complex -->
        <g class="map-marker" onclick="scrollToLocation(2)" data-loc="2">
          <rect x="700" y="270" width="175" height="65" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#mapShadow)"/>
          <circle cx="732" cy="292" r="8" fill="#2563EB"/>
          <text x="732" y="296" text-anchor="middle" font-size="10" fill="#fff" font-weight="700" font-family="DM Sans">3</text>
          <text x="806" y="296" text-anchor="middle" font-size="13" fill="#1A1D23" font-weight="700" font-family="Libre Franklin">Sports Complex</text>
          <text x="787" y="320" text-anchor="middle" font-size="11" fill="#5F6B7A" font-family="DM Sans">3 Pods · 1 Free</text>
        </g>

        <defs>
          <filter id="mapShadow" x="-4%" y="-4%" width="108%" height="116%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
          </filter>
        </defs>
      </svg>
    </div>
  </div>

  <!-- Location Cards -->
  <div class="locations-grid" id="locationsGrid"></div>
</div>

<!-- Time Slot Panel Overlay -->
<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <div class="panel-header">
      <div>
        <div class="panel-title" id="panelTitle">Pod A1</div>
        <div class="panel-sub" id="panelSub">Library · Available</div>
      </div>
      <button class="panel-close" onclick="closePanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="timeslots-label">Select a time slot</div>
      <div class="timeslots-grid" id="timeslotsGrid"></div>

      <div class="form-section" id="formSection">
        <label class="form-label" for="nameInput">Full Name</label>
        <input class="form-input" id="nameInput" type="text" placeholder="e.g. John Tan">
        <label class="form-label" for="idInput">Student ID</label>
        <input class="form-input" id="idInput" type="text" placeholder="e.g. S10234567">
        <button class="btn-reserve" id="btnReserve" disabled onclick="confirmReservation()">Confirm Reservation</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── Data ──
  const locations = [
    {
      name: "Library",
      pods: [
        { id: "L1", status: "available" },
        { id: "L2", status: "occupied" },
        { id: "L3", status: "available" },
        { id: "L4", status: "reserved" },
      ]
    },
    {
      name: "Student Lounge",
      pods: [
        { id: "SL1", status: "available" },
        { id: "SL2", status: "occupied" },
        { id: "SL3", status: "available" },
        { id: "SL4", status: "available" },
        { id: "SL5", status: "reserved" },
      ]
    },
    {
      name: "Sports Complex",
      pods: [
        { id: "SC1", status: "occupied" },
        { id: "SC2", status: "available" },
        { id: "SC3", status: "reserved" },
      ]
    }
  ];

  // Pre-generate some unavailable time slots per pod
  const unavailableSlots = {};
  locations.forEach(loc => {
    loc.pods.forEach(pod => {
      const taken = new Set();
      const numTaken = Math.floor(Math.random() * 8) + 3;
      while (taken.size < numTaken) {
        taken.add(Math.floor(Math.random() * 24));
      }
      unavailableSlots[pod.id] = taken;
    });
  });

  let selectedPod = null;
  let selectedLocation = null;
  let selectedSlot = null;

  // ── Render Location Cards ──
  function renderLocations() {
    const grid = document.getElementById('locationsGrid');
    grid.innerHTML = '';

    locations.forEach((loc, locIdx) => {
      const availCount = loc.pods.filter(p => p.status === 'available').length;
      const card = document.createElement('div');
      card.className = 'location-card';
      card.id = `loc-${locIdx}`;

      const podBedSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 012 2v10"/><path d="M2 17h20"/><path d="M6 8v3"/></svg>`;

      card.innerHTML = `
        <div class="location-card-header">
          <div class="location-name">${loc.name}</div>
          <div class="location-badge ${availCount === 0 ? 'none' : ''}">${availCount > 0 ? availCount + ' Available' : 'Full'}</div>
        </div>
        <div class="pods-container">
          <div class="pods-grid">
            ${loc.pods.map(pod => `
              <div class="pod ${pod.status}" data-pod="${pod.id}" data-loc="${locIdx}" onclick="podClick(this, '${pod.id}', ${locIdx})">
                ${podBedSVG}
                <span class="pod-label">${pod.id}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // ── Pod Click ──
  function podClick(el, podId, locIdx) {
    const pod = locations[locIdx].pods.find(p => p.id === podId);
    if (!pod || pod.status !== 'available') return;

    // Remove previous selection
    document.querySelectorAll('.pod.selected').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');

    selectedPod = podId;
    selectedLocation = locIdx;
    selectedSlot = null;

    openPanel(podId, locIdx);
  }

  // ── Open Panel ──
  function openPanel(podId, locIdx) {
    const loc = locations[locIdx];
    document.getElementById('panelTitle').textContent = `Pod ${podId}`;
    document.getElementById('panelSub').textContent = `${loc.name} · Available`;

    // Generate time slots
    const grid = document.getElementById('timeslotsGrid');
    grid.innerHTML = '';
    const taken = unavailableSlots[podId] || new Set();

    for (let h = 0; h < 24; h++) {
      const start = String(h).padStart(2, '0') + ':00';
      const end = String((h + 1) % 24).padStart(2, '0') + ':00';
      const label = `${start}`;

      const btn = document.createElement('div');
      btn.className = 'timeslot';
      if (taken.has(h)) {
        btn.classList.add('unavailable');
        btn.textContent = label;
      } else {
        btn.textContent = label;
        btn.onclick = () => selectSlot(btn, h);
      }
      grid.appendChild(btn);
    }

    // Reset form
    document.getElementById('formSection').classList.remove('visible');
    document.getElementById('nameInput').value = '';
    document.getElementById('idInput').value = '';
    document.getElementById('btnReserve').disabled = true;

    document.getElementById('overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closePanel() {
    document.getElementById('overlay').classList.remove('active');
    document.body.style.overflow = '';
    document.querySelectorAll('.pod.selected').forEach(p => p.classList.remove('selected'));
    selectedPod = null;
    selectedSlot = null;
  }

  // Close on overlay bg click
  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closePanel();
  });

  // ── Select Time Slot ──
  function selectSlot(el, hour) {
    document.querySelectorAll('.timeslot.selected').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    selectedSlot = hour;
    document.getElementById('formSection').classList.add('visible');
    validateForm();
  }

  // ── Form Validation ──
  function validateForm() {
    const name = document.getElementById('nameInput').value.trim();
    const sid = document.getElementById('idInput').value.trim();
    document.getElementById('btnReserve').disabled = !(name && sid && selectedSlot !== null);
  }
  document.getElementById('nameInput').addEventListener('input', validateForm);
  document.getElementById('idInput').addEventListener('input', validateForm);

  // ── Confirm Reservation ──
  function confirmReservation() {
    const name = document.getElementById('nameInput').value.trim();
    const sid = document.getElementById('idInput').value.trim();
    if (!name || !sid || selectedSlot === null) return;

    // Update pod status
    const loc = locations[selectedLocation];
    const pod = loc.pods.find(p => p.id === selectedPod);
    if (pod) pod.status = 'reserved';

    // Mark time as unavailable
    if (unavailableSlots[selectedPod]) {
      unavailableSlots[selectedPod].add(selectedSlot);
    }

    const startTime = String(selectedSlot).padStart(2, '0') + ':00';
    const endTime = String((selectedSlot + 1) % 24).padStart(2, '0') + ':00';

    closePanel();
    renderLocations();
    showToast(`✓ Pod ${selectedPod} reserved for ${name} (${sid}) — ${startTime} to ${endTime}`);
  }

  // ── Scroll to Location Card ──
  function scrollToLocation(locIdx) {
    const card = document.getElementById(`loc-${locIdx}`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('active');
      setTimeout(() => card.classList.remove('active'), 1500);
    }
  }

  // ── Toast ──
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  // ── Init ──
  renderLocations();
</script>
</body>
</html>
